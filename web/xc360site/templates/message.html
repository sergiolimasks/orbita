{% extends "auth/_layout.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="a-ico flare">{{ icon('link', 24) }}</div>
<h1>{{ title }}</h1>
<p class="a-lead">{{ text }}</p>
<div class="stack-sm mt-6">
  <a class="btn primary block" href="{{ url_for('auth.login') }}">{{ _('nav.login') }}</a>
  <a class="btn secondary block" href="{{ url_for('public.home') }}">{{ _('ui.public_site') }}</a>
</div>
{% endblock %}
